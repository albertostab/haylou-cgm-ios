    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
targets:
  HaylouCGM:
    type: application
    platform: iOS
    sources:
      - path: HaylouCGM
        excludes:
          - Info.plist
