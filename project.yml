      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.albertostabile.HaylouCGM
        INFOPLIST_FILE: HaylouCGM/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    scheme:
      testTargets: []
