name: HaylouCGM
options:
  bundleIdPrefix: it.albertostabile
  createIntermediateGroups: true
settings:
  base:
    CURRENT_PROJECT_VERSION: "5"
    MARKETING_VERSION: "0.4.1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
targets:
  HaylouCGM:
    type: application
    platform: iOS
    sources:
      - path: HaylouCGM
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: HaylouLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.albertostabile.HaylouCGM
        INFOPLIST_FILE: HaylouCGM/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    scheme:
      testTargets: []

  HaylouLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: HaylouLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.albertostabile.HaylouCGM.LiveActivity
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: "YES"
    info:
      path: build/LiveActivity-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
