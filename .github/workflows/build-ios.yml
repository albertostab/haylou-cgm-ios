name: Compila Haylou CGM IPA (senza Mac personale)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, accessory-setup]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Scarica codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configura XcodeGen
        run: brew install xcodegen
      - name: Test offline encoder (frame RT2 già provato)
        run: |
          swiftc HaylouCGM/WeatherCodec.swift Tests/CodecSelfTest.swift -o /tmp/haylou-codec-test
          /tmp/haylou-codec-test
          swiftc HaylouCGM/WeatherCodec.swift HaylouCGM/WatchEventCodec.swift Tests/WatchEventCodecTest.swift -o /tmp/watch-event-test
          /tmp/watch-event-test
      - name: Test sincronizzazione e analisi sintassi Swift
        run: |
          swiftc HaylouCGM/SyncPolicy.swift Shared/Trend.swift Tests/SyncPolicyTest.swift -o /tmp/sync-test
          /tmp/sync-test
          swiftc Shared/GlucosePoint.swift Shared/HistoryWindow.swift Tests/HistoryWindowTest.swift -o /tmp/history-test
          /tmp/history-test
          swiftc Shared/GlucosePoint.swift HaylouCGM/RefreshPolicy.swift Tests/RefreshPolicyTest.swift -o /tmp/refresh-test
          /tmp/refresh-test
          xcrun swiftc -frontend -parse HaylouCGM/*.swift Shared/*.swift
          xcrun swiftc -frontend -parse HaylouLiveActivity/*.swift Shared/*.swift
          # Golden reference encoder test above preserves framing/CRC/command and conversion.
      - name: Configure experimental AccessorySetupKit IPA
        if: matrix.variant == 'accessory-setup'
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("HaylouCGM/Info.plist")
          info = plistlib.loads(path.read_bytes())
          info["NSAccessorySetupKitSupports"] = ["Bluetooth"]
          info["NSAccessorySetupBluetoothServices"] = ["FEE7", "000001FF-3C17-D293-8E48-14FE2E4DA212"]
          info["NSAccessorySetupBluetoothNames"] = ["Haylou", "HAYLOU", "haylou", "LS10", "RT2"]
          path.write_bytes(plistlib.dumps(info))
          PY
      - name: Genera progetto Xcode
        run: xcodegen generate
      - name: Mostra versione Xcode
        run: xcodebuild -version
      - name: Compila app per iPhone SENZA FIRMA
        run: |
          set -o pipefail
          xcodebuild -project HaylouCGM.xcodeproj -scheme HaylouCGM \
            -configuration Release -destination 'generic/platform=iOS' \
            -sdk iphoneos -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Prepara IPA unsigned (la firma avviene su Windows)
        run: |
          mkdir -p package/Payload
          cp -R "build/Build/Products/Release-iphoneos/HaylouCGM.app" package/Payload/
          cd package
          zip -qry ../HaylouCGM-unsigned.ipa Payload
      - name: Scarica IPA dagli artifacts di Actions
        uses: actions/upload-artifact@v4
        with:
          name: HaylouCGM-${{ matrix.variant }}-unsigned-IPA
          path: HaylouCGM-unsigned.ipa
          retention-days: 7
